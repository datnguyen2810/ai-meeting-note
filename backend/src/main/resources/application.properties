spring.application.name=backend

# Import file .env neu co (ho tro ca khi chay tu backend hoac tu thu muc goc)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# =============================================
# DATABASE - PostgreSQL
# =============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/neondb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =============================================
# JWT
# =============================================
app.jwt.secret=${JWT_SECRET:ai-meeting-note-super-secret-key-change-in-production-2024}
app.jwt.expiration-ms=86400000

# =============================================
# AI Service (Python FastAPI)
# =============================================
app.ai-service.base-url=http://localhost:8000
app.ai-service.transcribe-endpoint=/api/transcribe

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload.audio-dir=./uploads/audio

# =============================================
# CORS
# =============================================
spring.web.cors.allowed-origins=http://localhost:5173

# =============================================
# Server
# =============================================
server.port=8080
