spring.application.name=backend

# =============================================
# DATABASE - H2 In-Memory (local dev)
# =============================================
spring.datasource.url=jdbc:h2:mem:httmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# JWT
# =============================================
app.jwt.secret=ai-meeting-note-super-secret-key-change-in-production-2024
app.jwt.expiration-ms=86400000

# =============================================
# AI Service (Python FastAPI)
# =============================================
app.ai-service.base-url=http://localhost:8000
app.ai-service.transcribe-endpoint=/api/transcribe

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload.audio-dir=./uploads/audio

# =============================================
# CORS
# =============================================
spring.web.cors.allowed-origins=http://localhost:5173

# =============================================
# Server
# =============================================
server.port=8080
